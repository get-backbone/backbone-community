<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backbone - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://rsms.me">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>

<script src="config.js"></script>
<script src="auth-utils.js"></script>
<script src="api-client.js"></script>
<script src="actor-session.js"></script>
<script src="common.js"></script>

<div class="container">

    <h1>Register with Backbone</h1>
    <p>Create a new account to get started:</p>
    <form id="registerForm" class="left-align">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" minlength="6" required>
            <small class="help-text">Minimum 6 characters</small>
        </div>
        <div class="form-actions">
            <button class="btn" type="submit" id="submitBtn">Register</button>
            <a href="index.html" class="btn btn-cancel">Cancel</a>
        </div>
    </form>

    <div id="loading" class="loading">Registering...</div>
    <div id="error" class="error"></div>

</div>

<script src="register.js"></script>

</body>
</html>
