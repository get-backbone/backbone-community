<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backbone - Reset password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://rsms.me">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>

<body>

<script src="config.js"></script>
<script src="auth-utils.js"></script>
<script src="api-client.js"></script>
<script src="actor-session.js"></script>
<script src="common.js"></script>

<div class="container">

    <h1>Reset your password</h1>
    <p>Choose a new password for your account.</p>

    <form id="resetPasswordForm" class="left-align">
        <div class="form-group">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" name="newPassword" minlength="8" required>
            <small class="help-text">Minimum 8 characters</small>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required>
        </div>
        <div class="form-actions">
            <button class="btn" type="submit" id="submitBtn">Update password</button>
        </div>
    </form>

    <div id="loading" class="loading">Updating...</div>
    <div id="error" class="error"></div>
    <div id="success" class="success hidden"></div>

</div>

<script src="reset-password.js"></script>

</body>
</html>
