<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backbone - Forgot password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://rsms.me">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>

<body>

<script src="config.js"></script>
<script src="auth-utils.js"></script>
<script src="api-client.js"></script>
<script src="actor-session.js"></script>
<script src="common.js"></script>

<div class="container">

    <h1>Forgot your password?</h1>
    <p>Enter your email and we will send a reset link if an account exists.</p>

    <form id="forgotPasswordForm" class="left-align">
        <div class="form-group">
            <label for="emailAddress">Email Address</label>
            <input type="email" id="emailAddress" name="emailAddress" required>
        </div>
        <div class="form-actions">
            <button class="btn" type="submit" id="submitBtn">Send reset link</button>
            <a href="login.html" class="btn btn-cancel">Back to login</a>
        </div>
    </form>

    <div id="loading" class="loading">Sending...</div>
    <div id="error" class="error"></div>
    <div id="success" class="success hidden"></div>

</div>

<script src="forgot-password.js"></script>

</body>
</html>
