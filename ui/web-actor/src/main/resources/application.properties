# sdk-bundle parent-first for hashIntegrity — see libs/sdk/README.md (must live in application.properties).
quarkus.class-loading.parent-first-artifacts=io.backbone.core:sdk-bundle

quarkus.application.name=web-actor
quarkus.http.port=${WEB_ACTOR_PORT}
quarkus.config.locations=quarkus.properties,platform-config.yml,aws.properties,otel.properties,logging.properties

# Local Quarkus static UI only (deployed UI is CloudFront/S3). Restrict CORS to the app origin; JWT auth does not use cookies.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${BACKBONE_PUBLIC_ALB_URL:http://localhost:${WEB_ACTOR_PORT:}
quarkus.http.cors.methods=GET,HEAD,OPTIONS
quarkus.http.cors.headers=accept,content-type

# Developer/scaffold: no aws-api EventBridgeClient. Also build-gates EventBridgeAuditEventDispatcher
# (@IfBuildProperty); AuditDispatcherProducer falls back to NO_OP.
backbone.audit.enabled=false
