##################################
# LOGGING
##################################
# Defaults apply when no profile override is set (local `quarkus:dev` without QUARKUS_PROFILE).
# Deployed / IT profiles use the %profile blocks below.

# Human-readable console (ignored when JSON is enabled).
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%X{correlationId}] traceId=%X{traceId} spanId=%X{spanId} [%c{2}] %s%e%n
quarkus.log.console.json.enabled=false

quarkus.log.level=WARN
quarkus.log.category."io.backbone".level=DEBUG
quarkus.log.category."io.backbone.core.common.api.runtime".level=INFO
quarkus.log.category."io.backbone.kit.metrics.impl.persistence".level=INFO
quarkus.log.category."io.backbone.kit.metrics.impl.domain.support".level=INFO
quarkus.log.category."io.backbone.kit.throttle.impl.infrastructure".level=INFO
quarkus.log.category."io.backbone.core.security.api.http".level=INFO
quarkus.log.category."io.backbone.core.security.api.throttle".level=INFO
quarkus.log.category."io.backbone.core.common.api.runtime.shutdown".level=ERROR
quarkus.log.category."io.quarkus.runtime.configuration.ConfigDiagnostic".level=DEBUG

# VertxTracer warnings before OpenTelemetry SDK is ready (package name typo in Quarkus is intentional).
quarkus.log.category."io.quarkus.opentelemetry.runtime.tracing.intrumentation.vertx".level=ERROR
# Harmless Micrometer duplicate-gauge WARN (e.g. Redis pool metrics registered twice at startup).
quarkus.log.category."io.micrometer.core.instrument.MeterRegistry".level=ERROR

# Decorative panels (startup info / auth). Local default on; profiles below override.
auth.logging.decorative.enabled=false
service.info.decorative.enabled=true

##################################
# %dev — quarkus:dev
##################################
# Optional: uncomment for a one-off debug session with masked console lines.
#%dev.quarkus.log.console.filter=sensitive-data-mask
%dev.quarkus.log.category."io.backbone.kit.observability.aws.traces".level=WARN

##################################
# %test — QuarkusTest / Failsafe
##################################
# LicenceStartupObserver is @UnlessBuildProfile("test") — holder stays empty; skip licence panel.
%test.service.info.decorative.enabled=false
%test.quarkus.log.console.json.enabled=true
%test.quarkus.log.console.json.mdc.flat-fields=true
# default "detailed" drops log records on Quarkus 3.36.x (FORMAT_FAILURE NPE); use formatted.
%test.quarkus.log.console.json.exception-output-type=formatted
%test.quarkus.log.console.filter=sensitive-data-mask
%test.quarkus.log.category."io.backbone".level=INFO

##################################
# %int — integration / soak environments
##################################
%int.quarkus.log.console.json.enabled=true
%int.quarkus.log.console.json.mdc.flat-fields=true
%int.quarkus.log.console.json.exception-output-type=formatted
%int.quarkus.log.console.filter=sensitive-data-mask
%int.quarkus.log.category."io.backbone".level=INFO

##################################
# %prod — STAGE / PROD ECS
##################################
%prod.service.info.decorative.enabled=false
%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.mdc.flat-fields=true
%prod.quarkus.log.console.json.exception-output-type=formatted
%prod.quarkus.log.console.filter=sensitive-data-mask
%prod.quarkus.log.category."io.backbone".level=INFO

##################################
# %community — local community native compose (QUARKUS_PROFILE=community)
##################################
# Parent=prod for Redis / observability defaults; console stays plain for startup panels.
%community.quarkus.config.profile.parent=prod
%community.quarkus.log.console.json.enabled=false
%community.quarkus.log.category."io.backbone".level=DEBUG
%community.quarkus.log.category."io.backbone.kit.observability.aws.traces".level=WARN
%community.service.info.decorative.enabled=true
