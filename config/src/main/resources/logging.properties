##################################
# LOGGING
##################################
# Local dev: human-readable console with correlation and trace MDC fields.
# Deployed profiles use structured JSON (see profile blocks below); format is ignored when JSON is enabled.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%X{correlationId}] traceId=%X{traceId} spanId=%X{spanId} [%c{2}] %s%e%n
quarkus.log.console.json.enabled=false

# if you need raw log lines for a one-off debug session, comment this out locally
#%dev.quarkus.log.console.filter=sensitive-data-mask

%int.quarkus.log.console.json.enabled=true
%int.quarkus.log.console.json.mdc.flat-fields=true
# default "detailed" drops log records on Quarkus 3.36.x (FORMAT_FAILURE NPE in JsonFormatter); use formatted.
%int.quarkus.log.console.json.exception-output-type=formatted
%int.quarkus.log.console.filter=sensitive-data-mask

%test.quarkus.log.console.json.enabled=true
%test.quarkus.log.console.json.mdc.flat-fields=true
%test.quarkus.log.console.json.exception-output-type=formatted
%test.quarkus.log.console.filter=sensitive-data-mask

%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.mdc.flat-fields=true
%prod.quarkus.log.console.json.exception-output-type=formatted
%prod.quarkus.log.console.filter=sensitive-data-mask

# category log levels
quarkus.log.level=WARN
quarkus.log.category."io.backbone".level=DEBUG
%int.quarkus.log.category."io.backbone".level=INFO
%test.quarkus.log.category."io.backbone".level=INFO
%prod.quarkus.log.category."io.backbone".level=INFO
quarkus.log.category."io.backbone.core.common.runtime".level=INFO
quarkus.log.category."io.backbone.kit.metrics.impl.persistence".level=INFO
quarkus.log.category."io.backbone.kit.metrics.impl.domain.support".level=INFO
quarkus.log.category."io.backbone.kit.throttle.impl.infrastructure".level=INFO
quarkus.log.category."io.backbone.core.security.infrastructure.http".level=INFO
quarkus.log.category."io.backbone.core.security.infrastructure.throttle".level=INFO
quarkus.log.category."io.backbone.core.common.runtime.shutdown".level=ERROR

quarkus.log.category."io.quarkus.runtime.configuration.ConfigDiagnostic".level=DEBUG

# VertxTracer warnings occur when Vert.x handlers process requests before OpenTelemetry SDK is initialized.
# They are harmless and expected during application startup. Once the SDK is ready, tracing works normally.
# Suppress at the package level to catch the inner class VertxDelegator (the package name typo is correct)
quarkus.log.category."io.quarkus.opentelemetry.runtime.tracing.intrumentation.vertx".level=ERROR

# Harmless Micrometer duplicate-gauge WARN when Vert.x registers Redis pool metrics twice at startup.
quarkus.log.category."io.micrometer.core.instrument.MeterRegistry".level=ERROR

# Decorative authentication and service configuration logging (for development/debugging)
auth.logging.decorative.enabled=false
service.info.decorative.enabled=true
