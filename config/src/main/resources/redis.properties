##################################
# REDIS CONFIGURATION
##################################

quarkus.redis.hosts=redis://localhost:6380

%int.quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS}
%int.quarkus.redis.tls.enabled=true

# all tests use caffeine backend

%prod.quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS}
%prod.quarkus.redis.tls.enabled=true

# Cache is fail-open: do not fail readiness when Redis is unreachable.
# Rate-limit Redis readiness is checked separately when rate-limit.store=redis.
quarkus.redis.health.enabled=false
