##################################
# QUARKUS — test classpath overlay
##################################
# Copied onto every service test classpath via services/pom.xml, but ONLY loaded when listed in
# quarkus.config.locations (see auth-service src/test/resources/application.properties — last entry).
#
# Auth ITs omit quarkus.properties and use this file instead (Quarkus baseline + %test overrides).
# Other modules keep main locations (includes quarkus.properties) and put IT toggles in their own
# test application.properties / %test keys in logging|metrics|cache|otel — they do not load this file.
#
# Prefer %test.* in always-loaded shared files (logging.properties, cache.properties, …) when the
# override should apply to every QuarkusTest. Use this file for auth-IT-only location chains.

# --- Baseline (mirrors quarkus.properties; needed when that file is not on locations) ---
quarkus.banner.enabled=false
quarkus.devservices.enabled=false
quarkus.test.continuous-testing=disabled
quarkus.application.version=${project.version}
# NOTE: quarkus.class-loading.* is ignored here — only application.properties (see core/sdk/README.md).
quarkus.http.auth.proactive=false

# --- Test-only runtime ---
quarkus.shutdown.timeout=1
quarkus.shutdown.delay-enabled=false

# Build-time: avoid @Scheduled / audit side-effects hanging Failsafe JVMs.
notification.scheduler.enabled=false
backbone.audit.enabled=false

# Auth IT locations load metrics/otel before this file — force exporters off for QuarkusTest.
%test.backbone.observability.amp.remote-write.enabled=false
%test.backbone.observability.xray.export.enabled=false

# In-memory rate limit when this overlay is active (cache Caffeine is already %test in cache.properties).
%test.rate-limit.store=memory
