##################################
# QUARKUS
##################################
quarkus.banner.enabled=false
quarkus.devservices.enabled=false
quarkus.test.continuous-testing=disabled
# Version will be set from project.version during Maven builds, or via -Dquarkus.application.version when using CLI
quarkus.application.version=${project.version}

# NOTE: quarkus.class-loading.* is ignored here — only application.properties (see libs/sdk/README.md).

# Disable proactive authentication - we handle JWT validation in our own filter
# Without this, Quarkus Security tries to authenticate requests before our filters run
# This is needed for all services that use token authentication via TokenAuthenticationFilter
quarkus.http.auth.proactive=false

# Reduce shutdown timeout for tests to avoid 40s delays
quarkus.shutdown.timeout=1
quarkus.shutdown.delay-enabled=false

# Build-time: do not register @Scheduled beans so JVM exits after ITs (e.g. notification-service NotificationScheduler).
# notification-service sets quarkus.scheduler.enabled=false in its own test application.properties (only that module has quarkus-scheduler).
notification.scheduler.enabled=false
# Disable audit publishing so async audit client calls do not run (avoids hang on secrets in tests)
backbone.audit.enabled=false
# Quarkus ITs activate %test; deployed AWS STAGE uses profile "stage" and does not load this file.
%test.backbone.observability.amp.remote-write.enabled=false
%test.backbone.observability.xray.export.enabled=false
# Keep QuarkusTest fast and isolated (no Compose Redis required in unit/int test CI jobs).
%test.quarkus.cache.type=caffeine
%test.rate-limit.store=memory
