# Application-level rate limiting.
# Base keys: DEV / STAGE / PROD and local `quarkus:dev` (default profile).
rate-limit.store=redis
rate-limit.authenticated-capacity-per-minute=600
rate-limit.unauthenticated-capacity-per-minute=100
rate-limit.authenticated-refill-per-second=10
rate-limit.unauthenticated-refill-per-second=2

# %int.* : Set to high values for performance testing when needed
# Backbone INT ECS - QUARKUS_PROFILE=int (set from CDK stageEnv.name).
%int.rate-limit.authenticated-capacity-per-minute=100000
%int.rate-limit.unauthenticated-capacity-per-minute=100000
%int.rate-limit.authenticated-refill-per-second=10000
%int.rate-limit.unauthenticated-refill-per-second=10000
