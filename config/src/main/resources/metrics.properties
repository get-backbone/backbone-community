##################################
# METRICS
##################################
# Micrometer metrics configuration
# Exposes metrics in Prometheus format at /q/metrics endpoint

# Enable Micrometer
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-default=true

# Prometheus exporter configuration
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.export.prometheus.descriptions=true

# HTTP server metrics (request rate, latency, etc.)
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-server.ignore-patterns=/q/health,/q/metrics,/q/openapi

# JVM metrics (heap, GC, threads, etc.)
quarkus.micrometer.binder.jvm=true

# System metrics (CPU, memory, disk, etc.)
quarkus.micrometer.binder.system=true

# Outbound HTTP client metrics (REST Client / Vert.x client). Not used in local Grafana
# dashboards (scripts/metrics/grafana/*.sh); disabling avoids duplicate gauge warnings
# (e.g. http.client.active.connections with clientName=null).
quarkus.micrometer.binder.http-client.enabled=false

# Disable Netty binder to avoid duplicate 'netty.eventexecutor.workers' gauge registration
# (Vert.x already instruments the same Netty event loops). Re-enable if you need Netty
# allocator/memory metrics (allocator.memory.used, allocator.pooled.arenas, etc.).
quarkus.micrometer.binder.netty.enabled=false

##################################
# AMP remote write (STAGE / PROD)
##################################
backbone.observability.amp.remote-write.enabled=false
# Placeholder when env unset; only used when remote-write is enabled (STAGE/PROD ECS injects BACKBONE_AMP_REMOTE_WRITE_URL).
backbone.observability.amp.remote-write.url=${BACKBONE_AMP_REMOTE_WRITE_URL:http://127.0.0.1:9/remote_write}
backbone.observability.amp.push-interval=60s

# Local dev: quarkus dev always activates the dev profile. A second profile (e.g. QUARKUS_PROFILE=test
# or prod for ECS parity) stacks on top; %test/%prod then enables AMP unless dev explicitly turns it off.
%dev.backbone.observability.amp.remote-write.enabled=false
%int.backbone.observability.amp.remote-write.enabled=false

%test.backbone.observability.amp.remote-write.enabled=true
%prod.backbone.observability.amp.remote-write.enabled=true
