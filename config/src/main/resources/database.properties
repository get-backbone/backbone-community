##################################
# DATABASE
##################################
# PostgreSQL database configuration
# For local development, use environment variables or override in application.properties
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
# Logical DB name: default JDBC URL below, PostgresHealthCheck, and optional DB_NAME override must stay aligned.
backbone.postgres.database-name=${DB_NAME:backbone}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/${backbone.postgres.database-name}}

# Hibernate configuration
quarkus.hibernate-orm.log.sql=false

# Flyway configuration
quarkus.flyway.migrate-at-start=true

# Disable built-in datasource health check (we use custom PostgresHealthCheck instead)
quarkus.datasource.health.enabled=false

# Enable datasource metrics (Agroal connection pool metrics)
# Metrics exposed: agroal_active_count, agroal_available_count, 
# agroal_awaiting_count, agroal_acquire_count_total, etc.
quarkus.datasource.metrics.enabled=true

# Connection pool configuration (Agroal)
# RDS is db.t3.micro (~112 max_connections for PostgreSQL)
# 3 services use jdbc
# reserve ~15 conn for RDS/admin/replication:
# for ECS task count of 1:
#quarkus.datasource.jdbc.max-size=34
#quarkus.datasource.jdbc.min-size=10
# for ECS task count of 2:
quarkus.datasource.jdbc.max-size=14
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.jdbc.max-lifetime=30M
# Fail pool acquisition sooner than 10s so saturation shows up in metrics/alerts instead of long stalls.
quarkus.datasource.jdbc.acquisition-timeout=5
