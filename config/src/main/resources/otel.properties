##################################
# OpenTelemetry Tracing
##################################
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true

# Quarkus built-in OTLP uses traces.exporter=cdi (not otlp). See quarkus.io/guides/opentelemetry#default-2
quarkus.otel.traces.exporter=cdi

##################################
# Context Propagation
##################################
quarkus.otel.propagators=tracecontext,baggage

##################################
# Local dev - Quarkus OTLP to local collector (Jaeger UI, etc.)
##################################
%dev.quarkus.otel.exporter.otlp.enabled=true
%dev.quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
%dev.backbone.observability.xray.export.enabled=false

##################################
# Integration - tracing off
##################################
%int.quarkus.otel.traces.enabled=false
%int.quarkus.otel.enabled=false

##################################
# Deployed (STAGE / PROD) - X-Ray in-process export (no collector sidecar)
##################################
# ECS injects BACKBONE_XRAY_OTLP_ENDPOINT (https://xray.<region>.amazonaws.com/v1/traces).
# Quarkus OTLP exporter is disabled; traces go through XRayTraceExporter (backbone-kit).
backbone.observability.xray.export.enabled=false
# Placeholder when env unset; only used when X-Ray export is enabled (STAGE/PROD ECS injects BACKBONE_XRAY_OTLP_ENDPOINT).
backbone.observability.xray.otlp.endpoint=${BACKBONE_XRAY_OTLP_ENDPOINT:https://xray.us-west-2.amazonaws.com/v1/traces}

%test.quarkus.otel.exporter.otlp.enabled=false
%test.backbone.observability.xray.export.enabled=true

%prod.quarkus.otel.exporter.otlp.enabled=false
%prod.backbone.observability.xray.export.enabled=true
