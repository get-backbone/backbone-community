##################################
# CACHE CONFIGURATION
##################################
# Domain caches use Redis for all Quarkus profiles (local, INT, STAGE, PROD).
quarkus.cache.type=redis

# QuarkusTest / %test uses Caffeine (same @CacheResult API; no Redis required for Surefire/Failsafe).
%test.quarkus.cache.type=caffeine

# Token validation cache
# Caches JWT token validation results (both service and user tokens)
# TTL set to 1 hour to cover typical token lifetimes (tokens typically expire in 1 hour)
quarkus.cache.redis."token-validation".expire-after-write=1h
quarkus.cache.redis."token-validation".value-type=io.backbone.kit.security.api.dto.TokenValidation

# Actor profile cache
# Caches actor profile data from PostgreSQL to reduce database queries
# TTL set to 10 minutes - profile data changes infrequently
# value-type MUST match the @CacheResult return type.
# Actor lookups cache an explicit wrapper so Redis can represent "not found" without null.
quarkus.cache.redis."actor-profiles".expire-after-write=10m
quarkus.cache.redis."actor-profiles".value-type=io.backbone.services.actor.infrastructure.cache.CachedActorRecord

# Parsed document cache (document-service)
# Caches parsed document results from DynamoDB to reduce read capacity units (RCU)
# TTL set to 1 hour - documents are immutable once parsed (idempotent)
# Invalidated on document upload/re-parse
# value-type is the list element type for Redis JSON codec
quarkus.cache.redis."parsed-documents".expire-after-write=1h
quarkus.cache.redis."parsed-documents".value-type=io.backbone.core.domain.dto.document.DocumentResponse

# OIDC exchange token cache (auth-service)
# Caches short-lived single-use authentication tokens for OIDC callbacks
# TTL set to 5 minutes to match token expiration
# Tokens are single-use: removed from cache on exchange (via @CacheInvalidate)
quarkus.cache.redis."oidc-exchange-tokens".expire-after-write=5m
quarkus.cache.redis."oidc-exchange-tokens".value-type=io.backbone.core.oauth.infrastructure.cache.CachedAuthIdentity

# Password reset token cache (auth-service)
# Single-use tokens emailed via notification-service; longer TTL than OIDC exchange tokens
quarkus.cache.redis."password-reset-tokens".expire-after-write=45m
quarkus.cache.redis."password-reset-tokens".value-type=io.backbone.core.oauth.infrastructure.cache.CachedAuthIdentity

# OAuth login / account-link CSRF nonce cache (auth-service)
# Single-use opaque state values; TTL covers a typical IdP round-trip
quarkus.cache.redis."oauth-login-state".expire-after-write=10m
quarkus.cache.redis."oauth-login-state".value-type=io.backbone.core.oauth.infrastructure.cache.CachedOAuthLoginState

##################################
# QUTE TEMPLATE CACHE (notification-service)
##################################
# Compiled Qute templates stay in-memory; they are not suitable for Redis serialization.
# Required when domain caches use Redis and quarkus-qute is present.
quarkus.cache."qute-cache".type=caffeine
quarkus.cache.caffeine."qute-cache".maximum-size=1000
# Build-time only: satisfies RedisCacheProcessor when qute registers the cache name (see quarkusio/quarkus#35680).
quarkus.cache.redis."qute-cache".value-type=io.quarkus.qute.ResultNode
