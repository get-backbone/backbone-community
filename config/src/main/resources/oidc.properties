##################################
# OIDC - AWS COGNITO (Default Tenant)
##################################
# Service application type: no Quarkus OIDC authorization-code redirect flow. Human login uses POST /auth/login
# (InitiateAuth). JWT validation for API requests uses TokenAuthenticationFilter (CompositeTokenValidator).
quarkus.oidc.tenant-enabled=true
quarkus.oidc.auth-server-url=${aws.cognito.issuer-base-url}/${COGNITO_ACTOR_POOL_ID}
quarkus.oidc.client-id=${COGNITO_ACTOR_CLIENT_ID}
quarkus.oidc.credentials.secret=${COGNITO_ACTOR_CLIENT_SECRET}
quarkus.oidc.application-type=service
quarkus.oidc.authentication.scopes=openid,profile,email

# Local Quarkus dev + Floci: Cognito is via AWS SDK / TokenAuthenticationFilter; skip Quarkus OIDC discovery
%dev.quarkus.oidc.tenant-enabled=false

##################################
# OIDC - LINKEDIN (Named Tenant)
##################################
# Tenant disabled because LinkedIn OAuth2 is handled manually (not using Quarkus OIDC automatic flow)
quarkus.oidc.linkedin.tenant-enabled=false
quarkus.oidc.linkedin.application-type=service
quarkus.oidc.linkedin.discovery-enabled=false
quarkus.oidc.linkedin.auth-server-url=https://www.linkedin.com
quarkus.oidc.linkedin.token.issuer=https://www.linkedin.com
quarkus.oidc.linkedin.authorization-path=/oauth/v2/authorization
quarkus.oidc.linkedin.token-path=/oauth/v2/accessToken
quarkus.oidc.linkedin.user-info-path=https://api.linkedin.com/v2/userinfo
quarkus.oidc.linkedin.jwks-path=/oauth/keys
# LinkedIn developer app (OAuth2 client): LINKEDIN_OAUTH2_*; app-generated AES key: BACKBONE_OAUTH2_REFRESH_TOKEN_ENCRYPTION_KEY
quarkus.oidc.linkedin.client-id=${LINKEDIN_OAUTH2_CLIENT_ID:}
quarkus.oidc.linkedin.credentials.secret=${LINKEDIN_OAUTH2_CLIENT_SECRET:}
quarkus.oidc.linkedin.authentication.scopes=openid,profile,email

##################################
# OIDC - GOOGLE (Named Tenant)
##################################
# Tenant disabled: Google OAuth2 is handled manually (not using Quarkus OIDC automatic flow)
quarkus.oidc.google.tenant-enabled=false
quarkus.oidc.google.application-type=service
quarkus.oidc.google.discovery-enabled=false
quarkus.oidc.google.auth-server-url=https://accounts.google.com
# Google Cloud OAuth2 client config
quarkus.oidc.google.client-id=${GOOGLE_OAUTH2_CLIENT_ID:}
quarkus.oidc.google.credentials.secret=${GOOGLE_OAUTH2_CLIENT_SECRET:}
quarkus.oidc.google.authentication.scopes=openid,profile,email

##################################
# OAuth2 Refresh Token Encryption
##################################
# Base64-encoded AES-256 key for encrypting OAuth2 refresh tokens stored in database
# This reads from environment variable: BACKBONE_OAUTH2_REFRESH_TOKEN_ENCRYPTION_KEY
# The key must be a base64-encoded 256-bit (32-byte) AES key
# 
# Generate with: openssl rand -base64 32
# 
# Add to .envrc:
# export BACKBONE_OAUTH2_REFRESH_TOKEN_ENCRYPTION_KEY="<generated-base64-key>"
# 
# Note: This is different from SMALLRYE_CONFIG_SECRET_KEY (used for decrypting secrets.properties)
# This key is used specifically for encrypting/decrypting OAuth2 refresh tokens
backbone.oauth2.refresh-token.encryption-key=${BACKBONE_OAUTH2_REFRESH_TOKEN_ENCRYPTION_KEY:}
