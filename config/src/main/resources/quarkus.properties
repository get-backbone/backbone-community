##################################
# QUARKUS
##################################
quarkus.banner.enabled=false
quarkus.devservices.enabled=false
quarkus.test.continuous-testing=disabled
# Version will be set from project.version during Maven builds, or via -Dquarkus.application.version when using CLI
quarkus.application.version=${project.version}

# Aidsfuscator hashIntegrity seals sdk-bundle class bytes and re-reads them via
# ClassLoader.getResourceAsStream. QuarkusClassLoader prefers transformed .class
# bytes; parent-first keeps sealed bytes on the classpath for HI checks.
quarkus.class-loading.parent-first-artifacts=io.backbone.core:sdk-bundle

# Disable proactive authentication - we handle JWT validation in our own filter
# Without this, Quarkus Security tries to authenticate requests before our filters run
# This is needed for all services that use token authentication via TokenAuthenticationFilter
quarkus.http.auth.proactive=false

quarkus.http.idle-timeout=60
quarkus.http.read-timeout=30

# MP REST client (outbound HTTP): applies where the rest-client extension is present.
# Pool sized to avoid BFF-side queuing at ~200 concurrent VUs (default 50 is too small for that envelope).
# connection-ttl: recycle pooled connections before a typical internal ALB idle timeout (default 60s)
# to reduce reuse of half-closed connections (ProcessingException / Connection was closed under load).
quarkus.rest-client.connection-pool-size=200
quarkus.rest-client.connection-ttl=55000

# Graceful shutdown configuration
# Timeout: Maximum time to wait for active requests to complete (30 seconds)
quarkus.shutdown.timeout=30
# Delay: Time before shutdown begins, allowing load balancers to detect shutdown (10 seconds)
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=10
# Note: Quarkus automatically handles JVM shutdown hooks (SIGTERM/SIGINT) - no configuration needed
