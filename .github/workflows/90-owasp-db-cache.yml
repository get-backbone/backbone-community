---
name: '90 🗄️ OWASP db cache'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Sunday 00:00 UTC

concurrency:
  group: owasp-db-cache
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  owasp-dependency-check-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/shell-tools
      - uses: actions/cache/restore@v5
        with:
          path: .dependency-check-cache
          key: dependency-check-${{ runner.os }}-v3
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - id: owasp-update
        run: .github/scripts/owasp-update-docker.sh

      - uses: actions/cache/save@v5
        if: success() && steps.owasp-update.outputs.cache_modified == 'true'
        with:
          path: .dependency-check-cache
          key: dependency-check-${{ runner.os }}-v3
