---
name: '02 🚧 Build and test'

# Community-mirror CI (*.yml.disabled so core Actions ignores it;
# 92-mirror-community promotes this file to 02-build-test.yml).

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/**
      - .github/scripts/**
      - config/**
      - applications/**
      - services/**
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths:
      - .github/**
      - .github/scripts/**
      - config/**
      - applications/**
      - services/**

# need actions: read to access artifacts from other jobs
permissions:
  contents: read
  actions: read
  packages: read

env:
  GITHUB_MAVEN_USERNAME: ${{ vars.USER_BACKBONE_DEPLOY }}
  GITHUB_MAVEN_TOKEN: ${{ secrets.PAT_BACKBONE_DEPLOY }}
  # OAuth / Cognito secrets not required until Floci auth ITs are enabled (see int-test).
  SMALLRYE_CONFIG_SECRET_KEY: ${{ secrets.SMALLRYE_CONFIG_SECRET_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Needed for commit range checks
          ref: main  # check out the branch, not detached HEAD
      - parallel:
          - uses: ./.github/actions/java-temurin
          - uses: ./.github/actions/shell-tools
      - run: .github/scripts/configure-maven-github.sh
      - run: task build:_install:ci
      - uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            **/target/*.jar
            **/target/classes
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: maven-repo
          path: ~/.m2/repository/io/backbonehq
          retention-days: 1
          if-no-files-found: warn

  unit-test:
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Needed for commit range checks
          ref: main  # check out the branch, not detached HEAD
      - parallel:
          - uses: ./.github/actions/java-temurin
          - uses: ./.github/actions/shell-tools
      - run: .github/scripts/configure-maven-github.sh
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts
      - uses: actions/download-artifact@v8
        with:
          name: maven-repo
          path: ~/.m2/repository/io/backbonehq
      - run: task test:unit -- -Dtest.thread.count=4
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '**/target/surefire-reports/TEST-*.xml'
          if-no-files-found: warn

  int-test:
    runs-on: ubuntu-latest
    needs: [ build ]
    env:
      # Dummy AWS credentials so SDK clients do not probe the real default chain
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Needed for commit range checks
          ref: main  # check out the branch, not detached HEAD
      - parallel:
          - uses: ./.github/actions/java-temurin
          - uses: ./.github/actions/shell-tools
          # Future: Floci / Cognito ITs (auth-shaped modules) — uncomment with seed steps below.
          # - uses: ./.github/actions/floci
      # Postgres apt-installs; keep it out of the shell-tools parallel group (dpkg lock).
      - uses: ./.github/actions/postgres
      - run: .github/scripts/configure-maven-github.sh
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts
      - uses: actions/download-artifact@v8
        with:
          name: maven-repo
          path: ~/.m2/repository/io/backbonehq
      - run: |
          # Future: Floci / Cognito ITs — uncomment with the floci action above.
          # task dev:floci
          # task seed:_it:cognito
          task test:_integration:ci -- -Dtest.thread.count=4
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: int-test-results
          path: '**/target/failsafe-reports/TEST-*.xml'
          if-no-files-found: warn

  unit-test-reporter:
    runs-on: ubuntu-latest
    needs: [ unit-test ]
    name: 📝 Unit test report
    if: always()
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: unit-test-results
          path: test-results/unit
      - uses: dorny/test-reporter@v3
        with:
          name: Unit Tests
          path: test-results/unit/**/*.xml
          reporter: java-junit

  int-test-reporter:
    runs-on: ubuntu-latest
    needs: [ int-test ]
    name: 📝 Integration test report
    if: always()
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: int-test-results
          path: test-results/integration
      - uses: dorny/test-reporter@v3
        with:
          name: Integration Tests
          path: test-results/integration/**/*.xml
          reporter: java-junit
