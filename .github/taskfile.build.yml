---
version: '3'

# use mvnd if available, otherwise (in CI) fallback to ./mvnw
vars:
  MAVEN_CMD: '$(command -v mvnd >/dev/null 2>&1 && echo mvnd || echo "./mvnw")'
  ROOT_DIR: "{{.TASKFILE_DIR}}/.."
  # exclude libs/sdk/reactor from root builds
  REACTOR_EXCLUDE: '-pl ''!libs/sdk/reactor'''

tasks:
  _default:
    cmds:
      - task --list-all

  ##################################
  # build
  ##################################

  nuke:
    desc: Delete the Maven build cache + stop mvn daemons
    dir: "{{.ROOT_DIR}}"
    cmds:
      - 'rm -rf ~/.m2/build-cache'
      - 'command -v mvnd >/dev/null 2>&1 && mvnd --stop || true'

  clean:
    desc: mvn clean
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} clean -am'

  compile:
    desc: mvn compile
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} compile {{.REACTOR_EXCLUDE}} -am'

  package:
    desc: mvn package -DskipTests
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} package -Dmaven.test.skip {{.REACTOR_EXCLUDE}} -am'

  # CI / selective native optimization — MODULE_PATHS from runtime-modules-changed.sh (space-separated)
  _native:
    desc: mvn package -Pnative -DskipTests (target modules; no parallel; no cache)
    dir: "{{.ROOT_DIR}}"
    vars:
      MODULE_PL:
        sh: echo '{{.MODULE_PATHS}}' | tr -s ' ' | tr ' ' ','
    cmds:
      - '{{.MAVEN_CMD}} -T 1 package -Pnative -Dmaven.build.cache.enabled=false -Dmaven.test.skip -pl ''{{.MODULE_PL}}'' -am'

  install:
    desc: mvn install -DskipTests
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} install -Dmaven.test.skip {{.REACTOR_EXCLUDE}} -am'

  # CI only (underscore = workflow entrypoint; same pattern as build:_native / _clover:*)
  _install:ci:
    desc: CI install — skip quarkus:build; exclude ui + template-service
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} install -Dmaven.test.skip -Dquarkus.build.skip=true -pl ''!libs/sdk/reactor,!ui,!ui/web-actor,!services/template-service'' -am {{.CLI_ARGS}}'
