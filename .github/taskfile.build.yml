---
version: '3'

# Developer-mirror build tasks (included from taskfile.developer.yml).
# template-service is scaffold-only — never build it here.

vars:
  MAVEN_CMD: '$(command -v mvnd >/dev/null 2>&1 && echo mvnd || echo "./mvnw")'
  ROOT_DIR: "{{.TASKFILE_DIR}}/.."
  HARDEN_SKIP: '-Dharden.skip=true'
  EXCLUDED_MODULES: '-pl ''!services/template-service'''

tasks:
  _default:
    cmds:
      - task --list-all

  nuke:
    desc: Delete the Maven build cache + stop mvn daemons
    dir: "{{.ROOT_DIR}}"
    cmds:
      - 'rm -rf ~/.m2/build-cache'
      - 'command -v mvnd >/dev/null 2>&1 && mvnd --stop || true'

  clean:
    desc: mvn clean
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} clean {{.EXCLUDED_MODULES}} -am'

  compile:
    desc: mvn compile
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} compile {{.EXCLUDED_MODULES}} -am'

  package:
    desc: mvn package -DskipTests
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} package -Dmaven.test.skip {{.HARDEN_SKIP}} {{.EXCLUDED_MODULES}} -am'

  install:
    desc: mvn install -DskipTests
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} install -Dmaven.test.skip {{.HARDEN_SKIP}} {{.EXCLUDED_MODULES}} -am'

  _install:ci:
    desc: mvn install -DskipTests -Dquarkus.build.skip
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} install -Dmaven.test.skip -Dquarkus.build.skip=true {{.HARDEN_SKIP}} {{.EXCLUDED_MODULES}} -am {{.CLI_ARGS}}'
