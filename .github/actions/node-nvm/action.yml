---
name: 'Node via nvm'
description: >-
  Install Node from the repo .nvmrc using nvm (matches scripts/bootstrap/nvm-env.sh)
  and restore the npm download cache for infra package-lock.json.

inputs:
  cache-dependency-path:
    description: package-lock.json path used for the npm cache key
    required: false
    default: infra/package-lock.json

runs:
  using: composite
  steps:
    - name: Restore npm cache
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: node-cache-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}
        restore-keys: |
          node-cache-${{ runner.os }}-

    - name: Install Node from .nvmrc
      if: runner.os == 'Linux'
      shell: bash
      run: |
        export NVM_DIR="${HOME}/.nvm"
        if [ ! -s "${NVM_DIR}/nvm.sh" ]; then
          echo "nvm not found at ${NVM_DIR}/nvm.sh" >&2
          exit 1
        fi
        # shellcheck disable=SC1091
        . "${NVM_DIR}/nvm.sh"
        nvm install
        nvm use
        node -v
        npm -v
