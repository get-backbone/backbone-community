---
version: '3'

# Developer-mirror test tasks (included from taskfile.developer.yml).
# Exercises template-service / actor-bff / web-actor present in the mirror.

vars:
  MAVEN_CMD: '$(command -v mvnd >/dev/null 2>&1 && echo mvnd || echo "./mvnw")'
  ROOT_DIR: "{{.TASKFILE_DIR}}/.."

tasks:

  _default:
    cmds:
      - task --list-all

  all:
    desc: mvn verify
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} verify -am'

  unit:
    desc: mvn test; no IT
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} test -am {{.CLI_ARGS}}'

  integration:
    desc: mvn verify; IT only (MODULE=…)
    dir: "{{.ROOT_DIR}}"
    vars:
      MODULE: '{{.MODULE | default ""}}'
      PL_FLAG: '{{if eq .MODULE ""}}{{else}}-pl ''{{.MODULE}}''{{end}}'
    cmds:
      - '{{.MAVEN_CMD}} verify {{.PL_FLAG}} -DskipUnitTests -am {{.CLI_ARGS}}'

  static:
    dir: "{{.ROOT_DIR}}"
    desc: Static analysis + OWASP (no tests)
    cmds:
      - '{{.MAVEN_CMD}} -Pcode-quality verify -am -DautoUpdate=false {{.CLI_ARGS}}'
      - '{{.MAVEN_CMD}} -Pdependency-check dependency-check:aggregate -DautoUpdate=false {{.CLI_ARGS}}'
