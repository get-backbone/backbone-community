---
version: '3'

# Included as `_clover` from root (CI-oriented weekly coverage).
# Community overrides CLOVER_EXCLUDED via include vars in taskfile.community.yml

vars:
  MAVEN_CMD: '$(command -v mvnd >/dev/null 2>&1 && echo mvnd || echo "./mvnw")'
  ROOT_DIR: "{{.TASKFILE_DIR}}/.."
  CLOVER_EXCLUDED: '{{.CLOVER_EXCLUDED | default "-pl ''!core/sdk/sdk-bundle,!services/template-service''"}}'

tasks:
  _default:
    cmds:
      - task --list-all

  unit:
    desc: Clover unit tests (all modules)
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} clover:setup test {{.CLOVER_EXCLUDED}} -am -Dsurefire.parallel=none -T 1'
      - 'command -v mvnd >/dev/null 2>&1 && mvnd --stop || true'

  integration:
    desc: Clover integration tests (MODULE=)
    dir: "{{.ROOT_DIR}}"
    vars:
      MODULE: '{{.MODULE | default ""}}'
      PL_FLAG: '{{if eq .MODULE ""}}{{.CLOVER_EXCLUDED}}{{else}}-pl ''{{.MODULE}}''{{end}}'
    cmds:
      - '{{.MAVEN_CMD}} clover:setup {{.PL_FLAG}} test-compile failsafe:integration-test failsafe:verify -DskipUnitTests -Dsurefire.parallel=none -T 1'
      - 'command -v mvnd >/dev/null 2>&1 && mvnd --stop || true'

  report:
    desc: Clover merged report (HTML)
    dir: "{{.ROOT_DIR}}"
    cmds:
      # singleCloverDatabase=true, all coverage is already in one DB, so just generate report on root
      - '{{.MAVEN_CMD}} clover:clover -pl :backbone-platform -Dsurefire.parallel=none -T 1'
      - 'command -v mvnd >/dev/null 2>&1 && mvnd --stop || true'
