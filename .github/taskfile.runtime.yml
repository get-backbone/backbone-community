---
version: '3'

# Runtime image build/push (CI). MAVEN_CMD prefers mvnd when installed, else ./mvnw. If protobuf races appear with mvnd,
# run the same Maven command with ./mvnw only (see libs/vendor/README.md).
# Image tagging:
#   - backbone/platform:<serviceName>  — floating tag ECS uses (mutable; same tag + new digest = overwrite on push)
#   - backbone/platform:<serviceName>-<mavenVersion>-<gitShortSha> — immutable audit tag (same commit/version rebuild overwrites same tag)
#   - backbone/platform:<serviceName>-native|jvm — informational runtime flavor tag for operator visibility
# ECR may list "untagged" digests after a tag moves to a new digest; that is normal (previous manifest loses the tag).
tasks:
  ecr-image-upload-jvm:
    desc: CI - ECR push one service JVM image (MODULE_PATH)
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR:
        sh: git rev-parse --show-toplevel
      GIT_SHORT_SHA:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      BACKBONE_MAVEN_VERSION:
        sh: '"{{.ROOT_DIR}}/mvnw" help:evaluate -Dexpression=project.version -q -DforceStdout'
    cmds:
      - |
        set -euo pipefail

        ecr_base="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/backbone/platform"
        serviceName="$(jq -rn --arg m "{{.MODULE_PATH}}" '$m | split("/") | .[1]')"
        immutable="${serviceName}-{{.BACKBONE_MAVEN_VERSION}}-{{.GIT_SHORT_SHA}}"
        runtime_flavor_tag="${serviceName}-jvm"

        docker build -f infra/docker/Dockerfile.quarkus --build-arg MODULE_PATH="{{.MODULE_PATH}}" \
          -t "${ecr_base}:${serviceName}" \
          -t "${ecr_base}:${immutable}" \
          -t "${ecr_base}:${runtime_flavor_tag}" \
          .

        docker push "${ecr_base}:${serviceName}"
        docker push "${ecr_base}:${immutable}"
        docker push "${ecr_base}:${runtime_flavor_tag}"

  ecr-image-upload-native:
    desc: CI - ECR push one service native image (MODULE_PATH)
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR:
        sh: git rev-parse --show-toplevel
      GIT_SHORT_SHA:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      BACKBONE_MAVEN_VERSION:
        sh: '"{{.ROOT_DIR}}/mvnw" help:evaluate -Dexpression=project.version -q -DforceStdout'
    cmds:
      - |
        set -euo pipefail

        ecr_base="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/backbone/platform"
        serviceName="$(jq -rn --arg m "{{.MODULE_PATH}}" '$m | split("/") | .[1]')"
        runner_file="${serviceName}-{{.BACKBONE_MAVEN_VERSION}}-runner"
        immutable="${serviceName}-{{.BACKBONE_MAVEN_VERSION}}-{{.GIT_SHORT_SHA}}"
        runtime_flavor_tag="${serviceName}-native"

        docker build -f infra/docker/Dockerfile.quarkus-native \
          --build-arg MODULE_PATH="{{.MODULE_PATH}}" \
          --build-arg NATIVE_RUNNER_FILENAME="${runner_file}" \
          -t "${ecr_base}:${serviceName}" \
          -t "${ecr_base}:${immutable}" \
          -t "${ecr_base}:${runtime_flavor_tag}" \
          .

        docker push "${ecr_base}:${serviceName}"
        docker push "${ecr_base}:${immutable}"
        docker push "${ecr_base}:${runtime_flavor_tag}"
