# sdk-bundle parent-first for hashIntegrity — see libs/sdk/README.md (must live in application.properties).
quarkus.class-loading.parent-first-artifacts=io.backbone.core:sdk-bundle

quarkus.application.name=template-service
quarkus.http.port=${TEMPLATE_SERVICE_PORT:8080}
quarkus.config.locations=quarkus.properties,platform-config.yml,aws.properties,throttle.properties,otel.properties,logging.properties,database.properties,metrics.properties,cache.properties,redis.properties

# per-service flyway schema configuration
quarkus.flyway.schemas=template
quarkus.flyway.default-schema=template
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=template

# REST service client configurations (AuthServiceClient for S2S tokens)
quarkus.rest-client.AuthServiceClient.url=${BACKBONE_INTERNAL_ALB_URL:http://localhost:${AUTH_SERVICE_PORT}}

# Developer/scaffold: no aws-api EventBridgeClient. Also build-gates EventBridgeAuditEventDispatcher
# (@IfBuildProperty); AuditDispatcherProducer falls back to NO_OP.
backbone.audit.enabled=false
