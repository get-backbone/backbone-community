# sdk-bundle parent-first for hashIntegrity — see libs/sdk/README.md (must live in application.properties).
quarkus.class-loading.parent-first-artifacts=io.backbone.core:sdk-bundle

quarkus.http.test-port=0

# disable all Quarkus dev services
quarkus.devservices.enabled=false

# bypass authentication in tests
security.test.bypass-auth=true

# disable audit dispatch in tests (also build-gates EventBridgeAuditEventDispatcher via @IfBuildProperty)
backbone.audit.enabled=false
