---
version: '3'

# Community-mirror Taskfile (promoted to taskfile.yml on 92 sync).
# Omits infra/CDK, packages publish, perf, and metrics (needs infra catalog).
# template-service is scaffold-only — no dev:template wrapper.
# Includes use post-promote names (.github/taskfile.build.yml / test.yml).

includes:
  # install/setup tasks
  lefthook: "scripts/taskfile.lefthook.yml"
  bootstrap: "scripts/taskfile.bootstrap.yml"
  seed: "scripts/taskfile.seed.yml"
  # internal tasks (not exposed via cli)
  _clover:
    taskfile: ".github/taskfile.clover.yml"
    vars:
      CLOVER_EXCLUDED: '-pl ''!services/template-service'''
  _static: ".github/taskfile.static.yml"
  # community tasks (promoted from *.community.yml on sync)
  dev: "scripts/taskfile.development.yml"
  build: ".github/taskfile.build.yml"
  test: ".github/taskfile.test.yml"
  smoke: "scripts/taskfile.smoke.yml"
  # operational tasks
  docker: "scripts/taskfile.docker.yml"
  quarkus: "scripts/taskfile.quarkus.yml"

tasks:
  _default:
    aliases: [default]
    cmds:
      - task --list-all

  dev:bff:
    desc: Quarkus dev - actor-bff
    cmds:
      - task: dev:application
        vars:
          APP: actor-bff

  dev:web:
    desc: Quarkus dev - web-actor
    cmds:
      - task: dev:ui
        vars:
          APP: web-actor
