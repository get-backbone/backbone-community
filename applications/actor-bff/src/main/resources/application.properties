
quarkus.application.name=actor-bff
quarkus.http.port=${ACTOR_BFF_PORT:8080}
quarkus.config.locations=quarkus.properties,platform-config.yml,aws.properties,throttle.properties,otel.properties,logging.properties,metrics.properties,cache.properties,redis.properties

# Browser origin is allowed to call this API (Quarkus CORS).
# Local dev: web-actor on WEB_ACTOR_PORT; AWS: public app URL (same origin via CloudFront in deployed envs).
# credentials remain off (default): browsers send Bearer JWT, not cookies.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${BACKBONE_PUBLIC_ALB_URL:http://localhost:${WEB_ACTOR_PORT}}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# REST service client configurations
quarkus.rest-client.AuthServiceClient.url=${BACKBONE_INTERNAL_ALB_URL:http://localhost:${AUTH_SERVICE_PORT}}
quarkus.rest-client.ActorServiceClient.url=${BACKBONE_INTERNAL_ALB_URL:http://localhost:${ACTOR_SERVICE_PORT}}
quarkus.rest-client.DocumentServiceClient.url=${BACKBONE_INTERNAL_ALB_URL:http://localhost:${DOCUMENT_SERVICE_PORT}}
quarkus.rest-client.NotificationServiceClient.url=${BACKBONE_INTERNAL_ALB_URL:http://localhost:${NOTIFICATION_SERVICE_PORT}}

# OpenAPI (served at /q/openapi; written under target/openapi on package, then copied to docs/openapi/)
quarkus.smallrye-openapi.info-title=Actor BFF API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Browser-facing Backbone API for authentication, actors, documents, and notification preferences.
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.smallrye-openapi.store-schema-file-name=actor-bff
quarkus.smallrye-openapi.auto-add-server=false
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
mp.openapi.scan.exclude.classes=io.backbone.kit.metrics.impl.reference.TestCircuitBreakerResource,io.backbone.kit.throttle.impl.reference.ReferenceTestResource

# Developer/scaffold: no aws-api EventBridgeClient. Also build-gates EventBridgeAuditEventDispatcher
# (@IfBuildProperty); AuditDispatcherProducer falls back to NO_OP.
backbone.audit.enabled=false
