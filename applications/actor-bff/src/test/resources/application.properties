
quarkus.http.test-port=0

# disable all Quarkus dev services
quarkus.devservices.enabled=false

# disable audit publishing in tests (no audit-service calls or secrets)
backbone.audit.enabled=false

# Do not set security.test.bypass-auth — ActorBffIT asserts unauthenticated → 401.

# Match main: exclude Composite so @DefaultBean RemoteUserTokenValidator is the TokenValidator.
quarkus.arc.exclude-types=io.backbone.core.security.infrastructure.cognito.CompositeTokenValidator
